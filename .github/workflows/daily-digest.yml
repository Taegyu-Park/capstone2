name: Daily News Digest

on:
  schedule:
    # 22:00 UTC = 익일 07:00 KST. GitHub cron은 혼잡 시 5~15분 지연될 수 있습니다.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '다시 생성할 날짜 (KST, YYYY-MM-DD). 비우면 전날.'
        required: false
        type: string
      preflight:
        description: 'Claude CLI 사전 점검 로그를 남깁니다.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # data/ 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

# 배포가 겹치지 않도록. 진행 중인 실행은 끝까지 두고 새 실행을 큐에 넣습니다.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Claude Code CLI 설치
        run: npm install -g @anthropic-ai/claude-code@stable

      - name: Claude CLI 사전 점검
        if: inputs.preflight
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/preflight.sh

      - name: 다이제스트 생성
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            node scripts/build.mjs --date="$TARGET_DATE"
          else
            node scripts/build.mjs
          fi

      - name: data/ 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo '변경된 데이터가 없습니다.'
          else
            # 실행 시각이 아니라 실제로 바뀐 data/*.json 파일명에서 날짜를 가져옵니다.
            # 수동 재실행처럼 실행 시각과 대상 날짜가 어긋나는 경우에도 커밋 메시지가 맞도록.
            CHANGED_DATE=$(git diff --staged --name-only -- 'data/*.json' | sed -E 's#data/([0-9-]+)\.json#\1#' | sort -u | tail -1)
            git commit -m "다이제스트 ${CHANGED_DATE} 갱신"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
